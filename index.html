<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevQuiz - Cyberpunk Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff; /* Neon Cyan */
            --accent: #7000ff;  /* Neon Purple */
            --white: #ffffff;
            --glass: rgba(10, 10, 20, 0.75);
            --border: rgba(0, 242, 255, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            color: var(--white);
            background-color: #050505;
            overflow-x: hidden;
        }

        /* --- VIDEO BACKGROUND (CYBERPUNK CITY) --- */
        .video-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; pointer-events: none; overflow: hidden;
        }
        .video-wrapper iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            filter: brightness(0.6) contrast(1.1);
        }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5, 5, 10, 0.4) 0%, rgba(5, 5, 10, 0.9) 100%);
            z-index: -1;
        }

        /* --- UI COMPONENTS (GLASSMORPHISM) --- */
        header {
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(20px);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
            position: sticky; top: 0; z-index: 100;
        }

        .container {
            max-width: 1100px; margin: 30px auto; padding: 0 20px;
            display: grid; grid-template-columns: 1fr 350px; gap: 30px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 24px; border-radius: 16px; text-align: center; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border);
            position: relative; overflow: hidden;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            background: rgba(0, 242, 255, 0.05);
        }

        .leaderboard {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 20px; padding: 24px;
            border: 1px solid var(--border);
        }

        .xp-badge {
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            padding: 6px 15px; border-radius: 8px; font-size: 0.85rem; font-weight: 800;
            border: 1px solid var(--primary);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* Ganti tombol jadi lebih neon */
        .btn-primary {
            background: linear-gradient(45deg, var(--accent), var(--primary));
            color: white; border: none; padding: 14px; border-radius: 12px;
            font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/9S_X_Xy_0-M?autoplay=1&mute=1&controls=0&loop=1&playlist=9S_X_Xy_0-M" frameborder="0" allow="autoplay"></iframe>
</div>
<div class="video-overlay"></div>

<header>
    <h2 style="margin:0; color:var(--primary); font-weight: 800; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);">⚡ DEVQUIZ.EXE</h2>
    <div id="user-info" style="display: flex; align-items: center; gap: 15px;">
        <span id="display-name" style="font-weight: 600;">Guest</span> 
        <span class="xp-badge"><span id="display-score">0</span> XP</span>
    </div>
</header>

<div class="container">
    <section>
        <h3 style="margin-bottom: 20px; color: var(--primary);">SYSTEM_MODULES:</h3>
        <div class="grid-languages" id="language-list">
            </div>
    </section>

    <aside>
        <div class="leaderboard">
            <h3
