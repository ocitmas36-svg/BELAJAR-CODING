<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLearn - Home</title>
    <style>
        :root { --p: #6366f1; --bg: #0f172a; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .xp-card { background: var(--p); padding: 10px 20px; border-radius: 10px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #334155; }
        .btn { background: var(--p); color: #fff; border: none; padding: 8px; border-radius: 5px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>DevLearn</h1>
        <div class="xp-card">XP: <span id="total-xp">0</span></div>
    </div>
    <div class="grid" id="container"></div>

    <script type="module">
        import { languages } from './js/data.languages.js';
        const progress = JSON.parse(localStorage.getItem('devlearn_xp')) || { totalXP: 0 };
        document.getElementById('total-xp').innerText = progress.totalXP;

        const container = document.getElementById('container');
        container.innerHTML = languages.map(lang => `
            <div class="card">
                <div style="font-size: 2rem">${lang.icon}</div>
                <h3>${lang.title}</h3>
                <button class="btn" onclick="location.href='learn.html?id=${lang.id}'">Belajar</button>
            </div>
        `).join('');
    </script>
</body>
</html>
