<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLearn - Level Up Your Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p: #6366f1; 
            --bg: #0f172a; 
            --card: rgba(255,255,255,0.05); 
            --success: #22c55e;
        }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px;
            padding: 10px 0;
        }

        .xp-badge { 
            background: var(--p); 
            padding: 8px 16px; 
            border-radius: 50px; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
        }

        .card { 
            background: var(--card); 
            border-radius: 18px; 
            padding: 20px; 
            text-align: center; 
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card:active { transform: scale(0.95); }

        .icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        
        h3 { margin: 10px 0; font-size: 1rem; }

        .btn { 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 10px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .status-done {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="margin:0; font-size: 1.5rem;">DevLearn</h1>
            <p style="margin:0; font-size: 0.8rem; color: #94a3b8;">Koleksi 15 Bahasa Pemrograman</p>
        </div>
        <div class="xp-badge">✨ <span id="total-xp">0</span> XP</div>
    </header>

    <div class="grid" id="container">
        </div>

    <script type="module">
        import { languages } from './js/data.languages.js';
        
        // 1. Ambil Progress dari LocalStorage
        const progress = JSON.parse(localStorage.getItem('devlearn_xp')) || { totalXP: 0, completed: [] };
        
        // 2. Tampilkan Total XP
        document.getElementById('total-xp').innerText = progress.totalXP;

        const container = document.getElementById('container');

        // 3. Render Kartu Bahasa secara Dinamis
        container.innerHTML = languages.map(lang => {
            const isDone = progress.completed.includes(lang.id);
            
            return `
                <div class="card" style="border: ${isDone ? '2px solid var(--success)' : '1px solid rgba(255,255,255,0.1)'}">
                    ${isDone ? '<span class="status-done">✅</span>' : ''}
                    <span class="icon">${lang.icon}</span>
                    <h3>${lang.title}</h3>
                    <button class="btn" 
                        style="background: ${isDone ? '#475569' : 'var(--p)'}"
                        onclick="location.href='learn.html?id=${lang.id}'">
                        ${isDone ? 'Lihat Lagi' : 'Mulai Belajar'}
                    </button>
                </div>
            `;
        }).join('');
    </script>
</body>
</html>
