<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLearn - Belajar Coding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #0f172a; --card: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; text-align: center; backdrop-filter: blur(10px); }
        .card h3 { margin: 10px 0 5px; font-size: 1.1rem; }
        .card p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; }
        .btn { background: var(--p); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .icon { font-size: 2rem; }
    </style>
</head>
<body>
    <header style="margin-bottom: 30px;">
        <h1 style="font-size: 1.5rem;">DevLearn</h1>
        <p style="color: #94a3b8;">Pilih bahasa untuk mulai belajar</p>
    </header>

    <div class="grid" id="container"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
