<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Materi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #0f172a; --card: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; padding: 20px; }
        .back-btn { color: var(--p); text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .content-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        code { background: #000; color: #0f0; padding: 10px; display: block; border-radius: 8px; margin-top: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Kembali</a>
    
    <div id="materi-container" class="content-card">
        <h1 id="title">Memuat...</h1>
        <p id="desc"></p>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <h3>Contoh Kode:</h3>
        <code id="code-sample">// kode akan muncul di sini</code>
    </div>

    <script type="module">
        import { languages } from './js/data.languages.js';
        
        // Ambil ID dari URL
        const params = new URLSearchParams(window.location.search);
        const langId = params.get('id');

        // Cari data bahasa yang cocok
        const data = languages.find(l => l.id === langId);

        if (data) {
            document.getElementById('title').innerText = data.icon + " " + data.title;
            document.getElementById('desc').innerText = data.desc;
            document.getElementById('code-sample').innerText = data.codeExample || "// Belum ada contoh kode.";
        } else {
            document.getElementById('title').innerText = "Oops! Materi tidak ketemu.";
        }
const btnDone = document.getElementById('btn-done');
const msg = document.getElementById('status-msg');

btnDone.addEventListener('click', () => {
    // 1. Ambil data lama dari LocalStorage (kalau ada)
    let progress = JSON.parse(localStorage.getItem('devlearn_xp')) || { totalXP: 0, completed: [] };

    // 2. Cek apakah bahasa ini sudah pernah diselesaikan
    if (!progress.completed.includes(langId)) {
        progress.totalXP += 10;
        progress.completed.push(langId);
        
        // 3. Simpan kembali ke LocalStorage
        localStorage.setItem('devlearn_xp', JSON.stringify(progress));
        
        msg.style.display = 'block';
        btnDone.innerText = 'Sudah Diselesaikan';
        btnDone.style.background = '#475569';
        btnDone.disabled = true;
    }
});

// Cek saat halaman dibuka, kalau sudah pernah selesai, tombolnya mati
let currentProgress = JSON.parse(localStorage.getItem('devlearn_xp'));
if (currentProgress && currentProgress.completed.includes(langId)) {
    btnDone.innerText = 'Sudah Diselesaikan';
    btnDone.style.background = '#475569';
    btnDone.disabled = true;
}
    </script>
</body>
</html>
<div style="margin-top: 30px;">
    <button id="btn-done" style="background: #22c55e; color: white; border: none; padding: 12px 20px; border-radius: 10px; width: 100%; font-weight: bold;">
        Tandai Selesai (+10 XP)
    </button>
</div>

<div id="status-msg" style="text-align: center; margin-top: 10px; color: #22c55e; display: none;">
    🎉 Materi berhasil diselesaikan!
</div>
