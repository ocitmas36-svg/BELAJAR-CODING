<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevQuiz Premium - Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p: #6366f1; /* Indigo */
            --s: #10b981; /* Success Green */
            --bg: #0f172a; /* Dark Navy */
            --card: #1e293b;
            --txt: #f8fafc;
            --txt-mute: #94a3b8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            color: var(--txt);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Nav Header */
        .nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .exit-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255,255,255,0.1);
            height: 12px;
            border-radius: 20px;
            margin-bottom: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--card);
            width: 100%;
            max-width: 550px;
            padding: 40px;
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .q-text {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .code-box {
            background: #000000;
            color: #818cf8;
            padding: 20px;
            border-radius: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-left: 4px solid var(--p);
            overflow-x: auto;
        }

        /* Options */
        .opt-grid {
            display: grid;
            gap: 12px;
        }

        .opt {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.08);
            color: var(--txt);
            padding: 18px 24px;
            border-radius: 18px;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--p);
            transform: scale(1.02);
        }

        .correct { 
            background: rgba(16, 185, 129, 0.2) !important; 
            border-color: var(--s) !important; 
            color: #34d399 !important;
        }

        .wrong { 
            background: rgba(239, 68, 68, 0.2) !important; 
            border-color: #ef4444 !important; 
            color: #f87171 !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Result View */
        .win-ui { text-align: center; display: none; }
        .win-ui h2 { font-size: 2.5rem; color: var(--s); margin-bottom: 10px; }
        .xp-badge {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            margin: 20px 0;
        }

        .btn-continue {
            background: var(--p);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-continue:hover { opacity: 0.9; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99,102,241,0.4); }
    </style>
</head>
<body>

    <div class="nav">
        <a href="index.html" class="exit-btn">✕ Keluar</a>
        <div style="font-weight: 800; color: var(--txt-mute);" id="lang-label">JAVASCRIPT</div>
        <div id="lives-display">❤️ 3</div>
    </div>

    <div class="progress-container">
        <div id="fill"></div>
    </div>

    <div class="quiz-card" id="quiz-ui">
        <div class="q-text" id="q-text">Loading question...</div>
        <div class="code-box" id="q-code">console.log("...")</div>
        <div class="opt-grid" id="options">
            </div>
    </div>

    <div class="quiz-card win-ui" id="win-ui">
        <div style="font-size: 5rem;">✨</div>
        <h2>MISSION COMPLETE</h2>
        <p style="color: var(--txt-mute);">Modul berhasil diselesaikan dengan sempurna.</p>
        <div class="xp-badge">+100 XP</div>
        <button class="btn-continue" onclick="location.href='index.html'">Lanjutkan</button>
    </div>

    </body>
    </html>
