<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Materi</title>
    <style>
        :root { --p: #6366f1; --bg: #0f172a; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .content { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; }
        code { background: #000; color: #4ade80; display: block; padding: 15px; border-radius: 10px; margin: 15px 0; overflow-x: auto; }
        .quiz-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 20px; }
        .opt-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; background: #334155; color: #fff; border: none; border-radius: 5px; text-align: left; }
        .btn-done { background: #475569; color: #fff; border: none; padding: 15px; border-radius: 10px; width: 100%; margin-top: 20px; font-weight: bold; }
        .active-done { background: #22c55e !important; }
    </style>
</head>
<body>
    <a href="index.html" style="color: var(--p); text-decoration: none;">← Kembali</a>
    <div class="content" style="margin-top: 20px;">
        <h1 id="title"></h1>
        <p id="desc"></p>
        <code><pre id="code-sample"></pre></code>

        <div class="quiz-box" id="quiz-container">
            <h4>Quiz:</h4>
            <p id="question"></p>
            <div id="options"></div>
        </div>

        <button id="btn-done" class="btn-done" disabled>Selesaikan Materi</button>
    </div>

    <script type="module">
        import { languages } from './js/data.languages.js';
        const params = new URLSearchParams(window.location.search);
        const langId = params.get('id');
        const data = languages.find(l => l.id === langId);

        const btn = document.getElementById('btn-done');

        if (data) {
            document.getElementById('title').innerText = data.icon + " " + data.title;
            document.getElementById('desc').innerText = data.desc;
            document.getElementById('code-sample').innerText = data.codeExample;
            document.getElementById('question').innerText = data.quiz.q;
            
            document.getElementById('options').innerHTML = data.quiz.options.map((opt, i) => `
                <button class="opt-btn" onclick="checkAns(${i})">${opt}</button>
            `).join('');
        }

        // Simpan progress ke LocalStorage
        let progress = JSON.parse(localStorage.getItem('devlearn_xp')) || { totalXP: 0, completed: [] };

        window.checkAns = (i) => {
            if (i === data.quiz.answer) {
                alert("Benar! Tombol selesai aktif.");
                btn.disabled = false;
                btn.classList.add('active-done');
            } else {
                alert("Salah! Coba lagi.");
            }
        };

        btn.onclick = () => {
            if (!progress.completed.includes(langId)) {
                progress.totalXP += 10;
                progress.completed.push(langId);
                localStorage.setItem('devlearn_xp', JSON.stringify(progress));
            }
            location.href = 'index.html';
        };

        // Jika sudah pernah selesai
        if (progress.completed.includes(langId)) {
            btn.disabled = false;
            btn.classList.add('active-done');
            btn.innerText = "Sudah Selesai (Kembali)";
        }
    </script>
</body>
</html>
