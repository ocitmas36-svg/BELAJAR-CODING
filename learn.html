<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevQuiz - Professional Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p: #6366f1; --s: #10b981; --bg: #0f172a;
            --card: #1e293b; --txt: #f8fafc; --txt-mute: #94a3b8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            color: var(--txt);
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px;
        }

        .nav { width: 100%; max-width: 600px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .exit-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 15px; border-radius: 12px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }

        .progress-container { width: 100%; max-width: 600px; background: rgba(255,255,255,0.1); height: 8px; border-radius: 20px; margin-bottom: 30px; overflow: hidden; }
        #fill { height: 100%; background: var(--p); width: 0%; transition: 0.5s; }

        .quiz-card { background: var(--card); width: 100%; max-width: 550px; padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
        .q-text { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
        .code-box { background: #000; color: #818cf8; padding: 20px; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 0.9rem; margin-bottom: 25px; border-left: 4px solid var(--p); white-space: pre-wrap; }

        .opt-grid { display: grid; gap: 12px; }
        .opt { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: var(--txt); padding: 16px; border-radius: 12px; text-align: left; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .opt:hover:not(:disabled) { border-color: var(--p); background: rgba(99, 102, 241, 0.05); }
        
        .correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--s) !important; color: #34d399 !important; }
        .wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: #f87171 !important; }

        /* Modal Kekalahan */
        #death-screen {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95);
            z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        .death-box { background: #1e293b; padding: 40px; border-radius: 30px; border: 2px solid var(--danger); max-width: 400px; }
    </style>
</head>
<body>

    <div class="nav">
        <a href="index.html" class="exit-btn">✕ Terminate</a>
        <div id="lang-label" style="font-weight: 800; opacity: 0.5;">MODULE</div>
    </div>

    <div class="progress-container"><div id="fill"></div></div>

    <div class="quiz-card" id="quiz-ui">
        <div class="q-text" id="q-text">System initializing...</div>
        <div class="code-box" id="q-code"></div>
        <div class="opt-grid" id="options"></div>
    </div>

    <div id="death-screen">
        <div class="death-box">
            <h1 style="color: var(--danger); font-size: 3rem; margin: 0;">ERROR!</h1>
            <p style="font-size: 1.2rem; font-weight: 700; margin: 20px 0 10px;">Status: <span style="color: #ff4757;">Rejected by Ocit</span></p>
            <p style="color: var(--txt-mute); line-height: 1.6;" id="mock-text"></p>
            <button class="exit-btn" style="margin-top: 30px; width: 100%; padding: 15px;" onclick="location.href='index.html'">Kembali Belajar Sana!</button>
        </div>
    </div>

    <script>
        const AI_BANK = {
            html: [
                { q: "Tag untuk memasukkan file JavaScript eksternal?", code: "<... src='script.js'></...>", opts: ["<js>", "<script>", "<javascript>", "<link>"], ans: 1 },
                // Tambahkan 20 soalmu di sini...
            ],
            js: [
                { q: "Cara mengecek panjang array?", code: "let arr = [1,2,3];\nconsole.log(arr....);", opts: ["size", "count", "length", "index"], ans: 2 }
            ]
        };

        // Pesan mengejek yang profesional
        const MOCK_MESSAGES = [
            "Kode kamu berantakan. Rapikan dulu logika kamu sebelum mencoba lagi.",
            "Junior developer terdeteksi. Silakan baca dokumentasi lagi, ya.",
            "Sangat disayangkan. Mungkin ngoding bukan bakat terpendammu?",
            "Compiler menolak jawabanmu. Terlalu banyak typo di otak?",
            "Ocit menyarankan kamu pindah ke divisi admin saja."
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const langId = urlParams.get('lang') || 'html';
        let currentStep = 0;
        let sessionQuestions = [];

        function initQuiz() {
            const source = AI_BANK[langId] || AI_BANK['html'];
            sessionQuestions = [...source].sort(() => 0.5 - Math.random()).slice(0, 5);
            document.getElementById('lang-label').innerText = langId.toUpperCase();
            showQuestion();
        }

        function showQuestion() {
            if (currentStep >= sessionQuestions.length) {
                alert("Selamat, kamu lolos review Ocit kali ini.");
                location.href = 'index.html';
                return;
            }

            const q = sessionQuestions[currentStep];
            document.getElementById('fill').style.width = (currentStep / 5) * 100 + "%";
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-code').innerText = q.code;

            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            
            q.opts.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = 'opt';
                b.innerText = o;
                b.onclick = () => checkAns(i, b);
                optDiv.appendChild(b);
            });
        }

        function checkAns(idx, btn) {
            const correct = sessionQuestions[currentStep].ans;
            if (idx === correct) {
                btn.classList.add('correct');
                setTimeout(() => { currentStep++; showQuestion(); }, 600);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => {
                    document.getElementById('quiz-ui').style.display = 'none';
                    document.getElementById('death-screen').style.display = 'flex';
                    document.getElementById('mock-text').innerText = MOCK_MESSAGES[Math.floor(Math.random() * MOCK_MESSAGES.length)];
                }, 500);
            }
        }

        window.onload = initQuiz;
    </script>
</body>
    </html>
