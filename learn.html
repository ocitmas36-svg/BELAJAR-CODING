<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Session - DevQuiz</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
            --dark: #1e293b;
            --bg: #f8fafc;
            --text-secondary: #64748b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--dark);
        }

        .quiz-container {
            background: white;
            width: 90%;
            max-width: 480px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .hearts { 
            color: var(--danger); 
            font-size: 1.1rem; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .progress-bar {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 32px;
            overflow: hidden;
        }

        #progress-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-out;
        }

        .question { 
            font-size: 1.25rem; 
            margin-bottom: 24px; 
            font-weight: 600; 
            line-height: 1.5;
            min-height: 60px;
        }

        .options-grid { 
            display: grid; 
            gap: 12px; 
        }

        button.option-btn {
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--dark);
            text-align: left;
        }

        button.option-btn:hover:not(:disabled) { 
            background: #f1f5f9; 
            border-color: var(--primary); 
        }
        
        button:disabled { cursor: not-allowed; }

        .correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }

        /* Status Screens */
        .status-title { font-size: 1.875rem; font-weight: 700; margin-bottom: 8px; }
        .status-text { color: var(--text-secondary); margin-bottom: 24px; }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <div id="game-ui">
        <div class="header">
            <button onclick="location.href='index.html'" style="border:none; background:none; cursor:pointer; color: var(--text-secondary); font-size: 1.5rem;">✕</button>
            <div class="hearts">❤️ <span id="life-count">3</span></div>
        </div>

        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>

        <div id="quiz-content">
            <div class="question" id="question-text">Memuat materi...</div>
            <div class="options-grid" id="options-container"></div>
        </div>
    </div>
</div>

<script type="module">
    import { languages } from './js/data.languages.js';

    const params = new URLSearchParams(window.location.search);
    const langId = params.get('lang');
    const currentLang = languages.find(l => l.id === langId);

    if (!currentLang) {
        window.location.href = 'index.html';
    }

    // Ambil 10 soal acak dari bank soal
    let quizData = [...currentLang.quizBank].sort(() => 0.5 - Math.random()).slice(0, 10);
    let currentIdx = 0;
    let lives = 3;

    function renderQuestion() {
        const q = quizData[currentIdx];
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            container.appendChild(btn);
        });

        const progress = (currentIdx / quizData.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;
    }

    function checkAnswer(choice, btn) {
        const correctAnswer = quizData[currentIdx].answer;
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (choice === correctAnswer) {
            btn.classList.add('correct');
            setTimeout(nextQuestion, 800);
        } else {
            btn.classList.add('wrong');
            allBtns[correctAnswer].classList.add('correct');
            lives--;
            document.getElementById('life-count').innerText = lives;

            if (lives <= 0) {
                setTimeout(showGameOver, 800);
            } else {
                setTimeout(nextQuestion, 1200);
            }
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            renderQuestion();
        } else {
            showWin();
        }
    }

    function showGameOver() {
        document.getElementById('quiz-box').innerHTML = `
            <div style="font-size: 3rem; margin-bottom: 16px;">❌</div>
            <div class="status-title">Game Over</div>
            <p class="status-text">Maaf, Anda kehabisan nyawa dalam sesi ini.</p>
            <button class="btn-primary" onclick="location.reload()">COBA LAGI</button>
            <button class="btn-outline" onclick="location.href='index.html'">KEMBALI KE HOME</button>
        `;
    }

    function showWin() {
        let userData = JSON.parse(localStorage.getItem('devQuiz_user')) || { completed: [] };
        if (!userData.completed.includes(langId)) {
            userData.completed.push(langId);
            localStorage.setItem('devQuiz_user', JSON.stringify(userData));
        }

        document.getElementById('quiz-box').innerHTML = `
            <div style="font-size: 3rem; margin-bottom: 16px;">🏆</div>
            <div class="status-title">Luar Biasa!</div>
            <p class="status-text">Anda berhasil menyelesaikan modul ${currentLang.title}.</p>
            <button class="btn-primary" style="background: var(--success);" onclick="location.href='index.html'">LANJUTKAN BELAJAR</button>
        `;
    }

    renderQuestion();
</script>

</body>
    </html>
