<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesi Belajar - DevQuiz</title>
    <style>
        :root {
            --primary: #4a90e2;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .quiz-container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .hearts { color: var(--danger); font-size: 1.2rem; font-weight: bold; }
        
        .progress-bar {
            background: #eee;
            height: 10px;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }

        #progress-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: 0.3s;
        }

        .question { font-size: 1.3rem; margin-bottom: 20px; font-weight: 600; }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        button.option-btn {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        button.option-btn:hover { background: #f0f7ff; border-color: var(--primary); }
        
        .correct { background: var(--success) !important; color: white; border-color: var(--success) !important; }
        .wrong { background: var(--danger) !important; color: white; border-color: var(--danger) !important; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <div class="header">
        <button onclick="location.href='index.html'" style="border:none; background:none; cursor:pointer;">✖</button>
        <div class="hearts">❤️ <span id="life-count">3</span></div>
    </div>

    <div class="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <div id="quiz-content">
        <div class="question" id="question-text">Memuat soal...</div>
        <div class="options-grid" id="options-container">
            </div>
    </div>
</div>

<script type="module">
    import { languages } from './js/data.languages.js';

    // 1. Ambil ID bahasa dari URL (misal: learn.html?lang=js)
    const params = new URLSearchParams(window.location.search);
    const langId = params.get('lang');
    const currentLang = languages.find(l => l.id === langId);

    if (!currentLang) {
        alert("Bahasa tidak ditemukan!");
        window.location.href = 'index.html';
    }

    // 2. State Permainan
    // Kita acak 20 soal dan ambil 10 saja agar tidak terlalu panjang
    let quizData = [...currentLang.quizBank].sort(() => 0.5 - Math.random()).slice(0, 10);
    let currentIdx = 0;
    let lives = 3;

    function renderQuestion() {
        const q = quizData[currentIdx];
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            container.appendChild(btn);
        });

        // Update Progress
        const progress = (currentIdx / quizData.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;
    }

    function checkAnswer(choice, btn) {
        const correctAnswer = quizData[currentIdx].answer;
        const allBtns = document.querySelectorAll('.option-btn');
        
        // Disable semua tombol agar tidak klik dua kali
        allBtns.forEach(b => b.disabled = true);

        if (choice === correctAnswer) {
            btn.classList.add('correct');
            setTimeout(nextQuestion, 1000);
        } else {
            btn.classList.add('wrong');
            lives--;
            document.getElementById('life-count').innerText = lives;
            
            // Tunjukkan jawaban yang benar
            allBtns[correctAnswer].classList.add('correct');

            if (lives <= 0) {
                setTimeout(() => {
                    alert("Yah, nyawa habis! Coba lagi ya.");
                    window.location.reload();
                }, 1000);
            } else {
                setTimeout(nextQuestion, 1500);
            }
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        // Simpan progress ke LocalStorage
        let userData = JSON.parse(localStorage.getItem('devQuiz_user')) || { completed: [] };
        if (!userData.completed.includes(langId)) {
            userData.completed.push(langId);
            localStorage.setItem('devQuiz_user', JSON.stringify(userData));
        }

        document.getElementById('quiz-box').innerHTML = `
            <h2 style="color:var(--success)">Luar Biasa! 🎉</h2>
            <p>Kamu telah menyelesaikan materi ${currentLang.title}.</p>
            <button onclick="location.href='index.html'" 
                style="background:var(--primary); color:white; border:none; padding:15px 30px; border-radius:10px; cursor:pointer;">
                Kembali ke Menu
            </button>
        `;
    }

    // Jalankan pertama kali
    renderQuestion();
</script>

</body>
    </html>
